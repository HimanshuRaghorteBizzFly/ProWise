# Local development (SPRING_PROFILES_ACTIVE=dev).
prowise:
  auth:
    # Local http://localhost: the refresh cookie cannot be Secure-only for every browser.
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  sandbox:
    seed-enabled: true
  demo-users:
    seed-enabled: true

logging:
  level:
    com.prowise: DEBUG

spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
