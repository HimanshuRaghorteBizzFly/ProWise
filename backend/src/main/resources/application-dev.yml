# Local development (SPRING_PROFILES_ACTIVE=dev).
# Email uses the same real SMTP settings as every other profile (SMTP_* in backend/.env or the admin panel).
prowise:
  auth:
    # Local http://localhost: the refresh cookie cannot be Secure-only for every browser.
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  sandbox:
    seed-enabled: true
  demo-users:
    seed-enabled: true

logging:
  level:
    com.prowise: DEBUG
