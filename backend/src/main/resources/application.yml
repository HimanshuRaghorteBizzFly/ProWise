spring:
  application:
    name: prowise-api
  config:
    # Local convenience: values from backend/.env (git-ignored). Real environments use env vars.
    # PROWISE_ENV_FILE lets the Maven test run point this away from backend/.env, so tests never use real
    # SMTP credentials or bootstrap addresses (see maven-surefire-plugin in pom.xml).
    import: optional:file:${PROWISE_ENV_FILE:.env}[.properties]
  datasource:
    # No defaults on purpose: RequiredEnvironmentValidator fails startup with a clear message.
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      data-source-properties:
        options: "-c TimeZone=UTC"
  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 20s
  # Environment fallback for SMTP. Settings saved by the Super Admin (encrypted password) take precedence.
  # Delivery goes through SmtpMailGateway: STARTTLS required on 587, timeouts under prowise.mail below.
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}

server:
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs

prowise:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  sandbox:
    seed-enabled: false
  mail:
    from: ${SMTP_FROM:}
    from-name: ${SMTP_FROM_NAME:ProWise Platform}
    reply-to: ${SMTP_REPLY_TO:}
    # TLS (STARTTLS, 587), SSL (465) or NONE (localhost relay only). Empty: derived from the port.
    encryption: ${SMTP_ENCRYPTION:}
    connect-timeout-ms: ${SMTP_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${SMTP_READ_TIMEOUT_MS:15000}
    write-timeout-ms: ${SMTP_WRITE_TIMEOUT_MS:15000}
    # AES-256-GCM key for SMTP passwords saved from the admin panel (32+ characters). Server-side only.
    credential-encryption-key: ${SMTP_CREDENTIAL_ENCRYPTION_KEY:}
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
  worker:
    outbox-delay-ms: ${OUTBOX_POLL_DELAY_MS:5000}
  bootstrap:
    # Optional, set only by deployment configuration. When set and no legitimate Super Admin exists, startup
    # creates one pending Super Admin and emails a single-use 72-hour setup link (SuperAdminBootstrapService).
    # There is no HTTP endpoint for this. Remove the variable once the account is active.
    super-admin-email: ${PROWISE_BOOTSTRAP_SUPER_ADMIN_EMAIL:}
