spring:
  application:
    name: prowise-api
  config:
    # Local convenience: values from backend/.env (git-ignored). Real environments use env vars.
    import: optional:file:.env[.properties]
  datasource:
    # No defaults on purpose: RequiredEnvironmentValidator fails startup with a clear message.
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      data-source-properties:
        options: "-c TimeZone=UTC"
  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 20s
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
          timeout: 5000
          connectiontimeout: 5000

server:
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs

prowise:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  sandbox:
    seed-enabled: false
  mail:
    from: ${SMTP_FROM:no-reply@prowise.com}
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
  worker:
    outbox-delay-ms: ${OUTBOX_POLL_DELAY_MS:5000}
  auth:
    jwt-signing-key: ${JWT_SIGNING_KEY:test-default-signing-key-that-is-at-least-32-bytes-long}
    # Session lifetimes (env): a 15-minute access token, a 7-day refresh session (absolute from sign-in unless sliding).
    access-token-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-token-days: ${REFRESH_TTL_DAYS:7}
    refresh-sliding: ${REFRESH_SLIDING:false}
    # Two tabs refreshing with the same cookie at the same moment are not treated as token theft within this window.
    refresh-reuse-grace-seconds: ${REFRESH_REUSE_GRACE_SECONDS:10}
    # The refresh cookie: Secure everywhere except local http development; path = browser-facing auth endpoints.
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    refresh-cookie-path: ${AUTH_REFRESH_COOKIE_PATH:/api/v1/auth}
