spring:
  application:
    name: prowise-api
  config:
    # Local convenience: values from backend/.env (git-ignored). Real environments use env vars.
    import: optional:file:.env[.properties]
  datasource:
    # No defaults on purpose: RequiredEnvironmentValidator fails startup with a clear message.
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      data-source-properties:
        options: "-c TimeZone=UTC"
  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 20s

server:
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  api-docs:
    path: /v3/api-docs

prowise:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  sandbox:
    seed-enabled: false
  worker:
    outbox-delay-ms: ${OUTBOX_POLL_DELAY_MS:5000}
  auth:
    jwt-signing-key: ${JWT_SIGNING_KEY:}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
