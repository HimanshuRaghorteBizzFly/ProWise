spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/prowise}
    username: ${DB_USERNAME:prowise}
    password: ${DB_PASSWORD:ci-password}
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
prowise:
  auth:
    jwt-signing-key: ${JWT_SIGNING_KEY:test-signing-key-that-is-at-least-32-bytes-long}
